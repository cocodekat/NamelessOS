# Disable the auto-boot timeout entirely — menu waits for input
timeout: no

# Solid backdrop color (hex), used if no wallpaper or while it loads
backdrop: 1a1b26

# Make all interface text (including branding) bigger
term_font_scale: 2x2

# Custom branding text shown at the top of the menu instead of "Limine"
interface_branding: NamelessOS
interface_branding_colour: ffffff    # RRGGBB hex — white

# Terminal/menu color palette (8 base colors, ANSI order: black,red,green,yellow,blue,magenta,cyan,white)
term_palette: 1a1b26;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;a9b1d6
term_palette_bright: 414868;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5

# Whether the boot menu editor ("e" to edit an entry) is accessible
editor_enabled: yes

# Suppress verbose boot log spam on the menu screen
quiet: no

# --- Entries ---

/Nameless OS
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/initrd.tar